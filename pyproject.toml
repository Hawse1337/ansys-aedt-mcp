[project]
name = "ansys-aedt-mcp"
version = "0.3.2"
description = "PyAEDT-backed MCP server for Ansys Electronics Desktop"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0,<2",
    "pyaedt==1.10.0",
    "psutil>=5.9,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools]
packages = ["aedt_guard"]
py-modules = [
    "aedt_target",
    "aedt_installation",
    "aedt_guidelines",
    "aedt_close_watcher",
    "worker_protocol",
    "pyaedt_backend",
    "pyaedt_capabilities",
    "maxwell_capabilities",
    "maxwell_tools",
    "pyaedt_worker",
    "worker_client",
    "wr90_case",
    "session_discovery",
    "aedt_launcher",
    "aedt_project_guard",
    "mcp_server",

    "solve_evidence",
]

[tool.uv]
package = false


